# Fondo
background {
    monitor =
    path = ~/pictures/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Reloj grande
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 120
    font_family = Hack Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(180, 190, 254, 1.0)
    font_size = 25
    font_family = Hack Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Input de contraseña
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(137, 180, 250, 1.0)
    inner_color = rgba(30, 30, 46, 1.0)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}
