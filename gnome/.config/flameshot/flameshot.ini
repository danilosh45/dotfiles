;; ~/.config/flameshot/flameshot.ini
;; Configuración de flameshot gestionada por dotfiles/gnome (stow).
;; La carpeta ~/.config/flameshot es la symlink destino.

[General]
disabledHotKeysData=\
{}
contrastColor=
contrastOpacity=200
copyToClipboard=true
copyAfterSave=true
savePath=$HOME/Pictures/Screenshots/
savePathFixed=true
saveAsFileImageExtension=png
saveQuality=90
filenamePattern=screenshot-%y%m%d-%H%M%S
autoCloseIdleDialog=true
showStartupLaunchMessage=false
desktopNotification=true
useGrimAdapter=false
showHelp=false
historyLimit=16